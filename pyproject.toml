[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "arjaa"
dynamic = ["version"]
description = "Cross-reference and citation integrity check for a Persian Word thesis: figure/table numbers (شکل ۲-۳) and mentions, in-text citations against the reference list, Jalali/Gregorian years. Offline; reports only."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Mohammadreza Zare", email = "mrzroot@users.noreply.github.com" }]
keywords = ["persian", "farsi", "docx", "thesis", "citations", "references", "cross-reference", "jalali", "iran"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Education",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Natural Language :: Persian",
  "Topic :: Text Processing :: Linguistic",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://mrzroot.github.io/arjaa/"
Source = "https://github.com/mrzroot/arjaa"
Issues = "https://github.com/mrzroot/arjaa/issues"

[project.scripts]
arjaa = "arjaa.cli:main"

[tool.setuptools.dynamic]
version = { attr = "arjaa.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
